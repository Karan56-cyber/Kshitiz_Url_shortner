services:
  - type: keyvalue
    name: linkpulse-redis
    region: oregon
    ipAllowList: []
    maxmemoryPolicy: noeviction
    persistenceMode: journal-snapshot

  - type: web
    name: linkpulse-pantkartik-api
    runtime: node
    region: oregon
    branch: pantkartik-linkpulse-dashboard
    buildCommand: npm ci && npm run db:generate && npm run build
    preDeployCommand: npm run db:deploy
    startCommand: npm run start
    healthCheckPath: /health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: "0.0.0.0"
      - key: DATABASE_URL
        fromDatabase:
          name: linkpulse-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: linkpulse-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PUBLIC_BASE_URL
        sync: false
      - key: CLICK_EVENT_RETENTION_DAYS
        value: "90"

  - type: worker
    name: linkpulse-click-worker
    runtime: node
    region: oregon
    branch: pantkartik-linkpulse-dashboard
    buildCommand: npm ci && npm run db:generate && npm run build
    startCommand: npm run worker
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: linkpulse-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: linkpulse-redis
          property: connectionString
      - key: CLICK_EVENT_RETENTION_DAYS
        value: "90"

databases:
  - name: linkpulse-db
    databaseName: linkpulse
    user: linkpulse
    region: oregon
    ipAllowList: []
